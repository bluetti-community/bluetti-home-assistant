name: Mark stale issues and pull requests

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10.4.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: >
            There hasn't been any activity on this issue recently. Is this issue still present?

            Please make sure to update to the latest Home Assistant version and version of this
            integration to see if that solves the issue. Let us know if that works for you by
            adding a comment 👍.

            This issue now has been marked as stale and will be closed if no further
            activity occurs. Thank you for your contributions.
          days-before-stale: 30
          days-before-close: 5
          stale-issue-label: "no-issue-activity"
          exempt-issue-labels: "enhancement, feature-request"
          stale-pr-message: >
            There hasn't been any activity on this pull request recently. This pull request has
            been marked as stale and will be closed if no further activity occurs.
          days-before-pr-stale: 30
          days-before-pr-close: 5
          stale-pr-label: "no-pr-activity"
