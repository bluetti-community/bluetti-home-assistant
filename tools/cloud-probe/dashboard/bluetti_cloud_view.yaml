# BLUETTI cloud probe - dashboard view (native cards only)
# Dashboard > ✏️ Edit > ⋮ > "Raw configuration editor": paste this block
# under `views:`. Or: add a view, ⋮ "Edit in YAML", paste it all.
#
# Entity IDs: those of an install of kit 1.1 or later. If you installed the
# very first (French) version of the package, replace:
#   sensor.bluetti_cloud_devicestates_response_time -> sensor.bluetti_cloud_devicestates_temps_de_reponse
#   binary_sensor.bluetti_cloud_devicestates_problem -> binary_sensor.bluetti_cloud_devicestates_en_panne
#   script.bluetti_probe_report_24h                  -> script.bluetti_probe_rapport
# (check them in Settings > Devices & services > Entities, search "bluetti cloud").

title: BLUETTI cloud
path: bluetti-cloud
icon: mdi:cloud-sync-outline
type: sections
max_columns: 3
badges:
  - type: entity
    entity: binary_sensor.bluetti_cloud_devicestates_problem
    name: Cloud
    show_name: true
    show_state: true
    show_icon: true
    color: red
  - type: entity
    entity: sensor.bluetti_cloud_devicestates
    name: Last check
    show_name: true
    state_content: last_changed
  - type: entity
    entity: sensor.bluetti_cloud_devicestates_response_time
    name: Response
    show_name: true
sections:

  # ── 1. Status ─────────────────────────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Cloud status
        heading_style: title
        icon: mdi:cloud-check-outline

      # Alert banner, only while the probe sees a problem
      - type: markdown
        visibility:
          - condition: state
            entity: binary_sensor.bluetti_cloud_devicestates_problem
            state: "on"
        content: |
          {%- set e = 'sensor.bluetti_cloud_devicestates' -%}
          {%- set st = states(e) -%}
          {%- set gw_ok = state_attr(e, 'noauth') == 'answered'
                          and state_attr(e, 'websocket') in ['answered', 'ok'] -%}
          {%- set alt = state_attr(e, 'other_gateways_auth') or {} -%}
          <ha-alert alert-type="error" title="Outage in progress for {{ relative_time(states.binary_sensor.bluetti_cloud_devicestates_problem.last_changed) }}">
          {%- if st in ['no_first_byte', 'slow'] and gw_ok %}
          The BLUETTI gateway answers, but the data service {{ 'no longer answers' if st == 'no_first_byte' else 'answers very slowly' }}. The outage is on BLUETTI's side, not yours.
          {%- elif st in ['no_tcp', 'no_tls'] %}
          The BLUETTI gateway cannot be reached ({{ st }}): check your internet connection first.
          {%- elif st == 'auth_error' %}
          {%- set gw = state_attr(e, 'gateway') or 'The gateway' -%}
          {%- set own = state_attr(e, 'integration_gateway') -%}
          {%- if own and own != gw %}
          {{ gw }} rejected the token (msgCode 805), but the integration uses {{ own }}. Leave GATEWAY empty in bluetti-probe.conf so the probe follows it.
          {%- else %}
          {{ gw }} rejected the token (msgCode 805). The community integration renews it and changes data center on its own: reconnect it only if it asks you to.
          {%- endif %}
          {%- else %}
          Probe state: {{ st }}.
          {%- endif %}
          {%- for host, v in alt.items() if v == 'ok' %}
          <br>👉 <b>{{ host }}</b> answers normally at the same time.
          {%- endfor %}
          </ha-alert>

      - type: tile
        entity: binary_sensor.bluetti_cloud_devicestates_problem
        name: BLUETTI cloud
        icon: mdi:cloud-alert-outline
        color: red
        state_content:
          - state
          - last_changed
        grid_options:
          columns: 6
      - type: tile
        entity: sensor.bluetti_cloud_devicestates
        name: Result
        icon: mdi:lan-check
        state_content:
          - state
          - last_changed
        grid_options:
          columns: 6

      - type: gauge
        entity: sensor.bluetti_cloud_devicestates_response_time
        name: deviceStates response time
        unit: ms
        min: 0
        max: 10000
        needle: true
        severity:
          green: 0
          yellow: 1000
          red: 5000

      - type: markdown
        content: |
          {%- set e = 'sensor.bluetti_cloud_devicestates' -%}
          {%- set st = states(e) -%}
          {%- set legend = {
            'ok': '🟢 Everything answers normally.',
            'slow': '🟠 Complete answer, but slow (over 5 s): degraded backend.',
            'empty': '🟠 Answer without values: device seen online, but no data.',
            'no_first_byte': '🔴 Connected, no answer: the symptom of issue #183.',
            'no_tls': '🔴 Connected, but no TLS handshake.',
            'no_tcp': '🔴 Gateway unreachable.',
            'body_incomplete': '🔴 Answer started, then cut.',
            'auth_error': '🔴 Token rejected (805).',
            'no_data': '⚫ No measurement yet.',
            'unknown': '⚫ No measurement yet.',
            'unavailable': '⚫ Sensor unavailable: restart in progress, or the probe command failed.'
          } -%}
          **{{ legend.get(st, '🟠 Unexpected answer: ' ~ st) }}**

  # ── 2. Last pass, layer by layer ──────────────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Last pass, layer by layer
        heading_style: title
        icon: mdi:layers-outline
      - type: markdown
        content: |
          {%- set e = 'sensor.bluetti_cloud_devicestates' -%}
          {%- set a = states[e].attributes if states[e] else {} -%}
          {%- macro ms(v) -%}
            {%- if v is none -%}—
            {%- elif v >= 1000 -%}{{ '%.1f' | format(v / 1000) }} s
            {%- else -%}{{ v | int }} ms
            {%- endif -%}
          {%- endmacro -%}
          {%- set tcp = a.get('t_tcp_ms', 0) | int -%}
          {%- set tls = a.get('t_tls_ms', 0) | int -%}
          {%- set fb  = a.get('t_first_byte_ms', 0) | int -%}
          {%- set tot = a.get('t_total_ms', 0) | int -%}
          {%- if a.get('ts') -%}
          Measured **{{ as_timestamp(a.ts) | timestamp_custom('%Y-%m-%d %H:%M:%S') }}** (local time)
          {%- endif %}


          | Stage | Duration | Status |
          |:--|--:|:--|
          | 🌐 DNS | — | {{ a.get('dns_status', '—') }} |
          | 🔌 TCP connection | {{ ms(tcp) if tcp > 0 else '—' }} | {{ '✅' if tcp > 0 else '❌' }} |
          | 🔒 TLS handshake | {{ ms(tls - tcp) if tls > 0 else '—' }} | {{ '✅' if tls > 0 else '❌' }} |
          | ⏳ Wait for first byte | {{ ms(fb - tls) if fb > 0 else '—' }} | {{ '✅' if fb > 0 else '❌ no answer' }} |
          | **Σ Total** | **{{ ms(tot) if tot > 0 else '—' }}** | {{ states(e) }} |


          | | |
          |:--|:--|
          | HTTP status | `{{ a.get('http_code', '—') }}` |
          | msgCode | `{{ a.get('msg_code') if a.get('msg_code') is not none else '—' }}` |
          | BLUETTI node | `{{ a.get('remote_ip') or '—' }}` |
          | DNS answer | `{{ a.get('dns_answer') or '—' }}` |
          | Request id | `{{ a.get('request_id') or 'none (BLUETTI sends none)' }}` |

  # ── 3. Comparison: where is the outage? ───────────────────────────────
  - type: grid
    cards:
      - type: heading
        heading: Where is the outage?
        heading_style: title
        icon: mdi:compare-horizontal
      - type: markdown
        content: |
          {%- set e = 'sensor.bluetti_cloud_devicestates' -%}
          {%- macro badge(v) -%}
            {%- if v in ['ok', 'answered'] -%}🟢 answers
            {%- elif v == 'slow' -%}🟠 slow
            {%- elif v == 'wrong_datacenter' -%}⚪ other continent (expected refusal)
            {%- elif v in ['no_first_byte', 'no_tls', 'no_tcp', 'body_incomplete'] -%}🔴 {{ v }}
            {%- elif v is none or v in ['', 'no_data', 'unknown', 'unavailable', 'skipped'] -%}⚫ —
            {%- else -%}🟠 {{ v }}
            {%- endif -%}
          {%- endmacro -%}
          **Same pass, same seconds:**


          | Request | Result |
          |:--|:--|
          | deviceStates **with** token (`{{ (state_attr(e, 'gateway') or 'gw').split('.')[0] }}`) | {{ badge(states(e)) }} |
          | devices **with** token | {{ badge(state_attr(e, 'devices_endpoint')) }} |
          {%- for host, v in (state_attr(e, 'other_gateways_auth') or {}).items() %}
          | deviceStates **with** token (`{{ host.split('.')[0] }}`) | {{ badge(v) }} |
          {%- endfor %}
          | deviceStates **without** token (gateway only) | {{ badge(state_attr(e, 'noauth')) }} |
          | Websocket | {{ badge(state_attr(e, 'websocket')) }} |
          {%- for host, v in (state_attr(e, 'other_gateways') or {}).items() %}
          | Without token on `{{ host.split('.')[0] }}` | {{ badge(v) }} |
          {%- endfor %}


          **Per node (IPs returned by DNS):**


          | Node | Result |
          |:--|:--|
          {%- for ip, v in (state_attr(e, 'per_ip') or {}).items() %}
          | `{{ ip }}` {{ '🇪🇺' if ip == '47.254.169.86' else ('🇺🇸' if ip == '47.253.45.39' else '') }} | {{ badge(v) }} |
          {%- endfor %}


          <ha-alert alert-type="info">If requests <b>with</b> the token fail while the gateway <b>without</b> token and the websocket answer, the outage is in BLUETTI's data service.</ha-alert>

  # ── 4. History ────────────────────────────────────────────────────────
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: History
        heading_style: title
        icon: mdi:chart-timeline-variant
      - type: history-graph
        title: Last 24 h
        hours_to_show: 24
        grid_options:
          columns: full
        entities:
          - entity: binary_sensor.bluetti_cloud_devicestates_problem
            name: Outage
          - entity: sensor.bluetti_cloud_devicestates
            name: Result
          - entity: sensor.bluetti_cloud_devicestates_response_time
            name: Response time
      - type: statistics-graph
        title: Response time over 7 days (hourly mean and max)
        days_to_show: 7
        period: hour
        chart_type: line
        stat_types:
          - mean
          - max
        grid_options:
          columns: full
        entities:
          - entity: sensor.bluetti_cloud_devicestates_response_time
            name: Response time

  # ── 5. Tools ──────────────────────────────────────────────────────────
  - type: grid
    column_span: 3
    cards:
      - type: heading
        heading: Tools
        heading_style: subtitle
        icon: mdi:tools
      - type: tile
        entity: script.bluetti_probe_report_24h
        name: Generate the 24 h report
        icon: mdi:file-document-outline
        color: primary
        tap_action:
          action: perform-action
          perform_action: script.bluetti_probe_report_24h
        icon_tap_action:
          action: perform-action
          perform_action: script.bluetti_probe_report_24h
        grid_options:
          columns: 6
      - type: markdown
        grid_options:
          columns: 6
        content: |
          The report shows up in the **notifications**. To paste it into
          GitHub, copy the raw file
          `/config/bluetti-probe/logs/report-last-1d.md`.
