# bluetti-probe.sh configuration inside the Home Assistant container.
# Put it at /config/bluetti-probe/bluetti-probe.conf (picked up automatically).

GATEWAY=""                              # empty = the integration's own gateway (recommended)
SNS=""                                  # serial number of ONE online device, e.g. AC3000000000001234
                                        # (the API reads only the first one of a list)

# Token read straight from Home Assistant on every pass: always current.
HA_CONFIG_ENTRIES="/config/.storage/core.config_entries"

OUT_DIR="/config/bluetti-probe/logs"
RETENTION_DAYS=7        # /config is part of Home Assistant backups: keep it short
COMPRESS_OLD=1

MAX_TIME=40             # fits within command_timeout: 90
LONG_PROBE_MAX_TIME=300 # detached long request on failure (0 disables it)
MTR_ON_FAILURE=0        # mtr is not available in the container
DNS_SERVERS="system 1.1.1.1 8.8.8.8 223.5.5.5"
PIN_ALL_IPS=1           # also query deviceStates on each IP seen in DNS
SLOW_MS=5000            # an answer slower than this counts as "slow"

# Token-less comparison (answered by the gateway alone).
# Leave empty to disable it and lower the load.
COMPARE_GATEWAYS="https://gwpry.bluettipower.com"

# Comparison WITH the token: does the backend behind gwde answer when the one
# behind gw does not? gw and gwde share an IP for EU users, so only a request
# addressed to gwde by name can tell. Leave empty to disable.
# Do not add gwpry: it answers EU tokens with msgCode 0 and placeholder values,
# which the probe would report as "ok".
AUTH_COMPARE_GATEWAYS="https://gwde.bluettipower.com"
